name: Deployment scaffold

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TESTGAP_RUNTIME: ci
      POSTGRES_PASSWORD: ci-bootstrap-placeholder
      POSTGRES_APP_PASSWORD: ci-app-placeholder
      POSTGRES_MIGRATION_PASSWORD: ci-migration-placeholder
      POSTGRES_TEST_PASSWORD: ci-test-placeholder
      POSTGRES_HOST_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --project apps/api --all-groups --locked
      - run: uv run --project apps/api pytest
      - run: docker compose config
      - run: docker build -t testgap-api:ci .
      - run: docker compose --project-name testgap-ci-${{ github.run_id }} up -d --wait postgres
      - run: docker compose --project-name testgap-ci-${{ github.run_id }} exec -T postgres pg_isready -U postgres -d testgap
      - run: test "$(docker compose --project-name testgap-ci-${{ github.run_id }} exec -T postgres psql -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'testgap_test'")" = 1
      - if: always()
        run: docker compose --project-name testgap-ci-${{ github.run_id }} down --volumes --remove-orphans
